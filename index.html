<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MydusChat</title>
<style>
  body{margin:0;font-family:system-ui,sans-serif;background:#0f1420;color:#e7ecf5;height:100dvh;display:flex;flex-direction:column}
  header{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:#161d2e;border-bottom:1px solid #232c42}
  header .ttl{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .btn{border:0;border-radius:50%;width:44px;height:44px;font-size:18px;background:#2a4a8f;color:#fff;flex:none}
  .ghost{background:#0f1420;color:#e7ecf5;border:1px solid #2a3550;border-radius:18px;padding:6px 12px;font-size:13px}
  #chat{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
  .row{display:flex}
  .row.me{justify-content:flex-end}
  .msg{max-width:78%;background:#1d2740;border-radius:14px;padding:9px 12px}
  .me .msg{background:#2a4a8f}
  .nm{font-size:11px;opacity:.6;margin-bottom:3px}
  .tm{font-size:10px;opacity:.5;text-align:right;margin-top:2px}
  audio{width:190px;height:34px;margin-top:4px}
  #bar{display:flex;gap:8px;padding:10px;background:#161d2e;border-top:1px solid #232c42}
  #inp{flex:1;background:#0f1420;border:1px solid #2a3550;color:#e7ecf5;border-radius:22px;padding:11px 14px;font-size:16px;outline:none}
  #rec{position:fixed;left:0;right:0;bottom:76px;display:flex;justify-content:center;align-items:center;gap:10px}
  #rec .pill{background:#a33;color:#fff;border-radius:20px;padding:8px 14px;font-size:14px}
  #rec button{border:0;border-radius:20px;padding:8px 14px;font-size:14px;background:#e7ecf5;color:#0f1420}
  .panel{position:fixed;inset:0;background:#0f1420;z-index:30;display:none;flex-direction:column}
  .panel.open{display:flex}
  .panel .phead{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#161d2e;border-bottom:1px solid #232c42;font-weight:700}
  .panel .pbody{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
  .field{background:#0f1420;border:1px solid #2a3550;color:#e7ecf5;border-radius:12px;padding:11px 14px;font-size:16px;outline:none}
  .primary{background:#2a4a8f;color:#fff;border:0;border-radius:12px;padding:12px;font-size:15px}
  .mitem{padding:12px 16px;border-bottom:1px solid #232c42;font-size:15px}
  .hint{font-size:12px;opacity:.55}
  .dmi{padding:12px;border:1px solid #2a3550;border-radius:12px;background:#161d2e}
</style>
</head>
<body>
<header><div class="ttl" id="ttl">MydusChat</div><button class="btn" id="burger">☰</button></header>
<div id="chat"></div>
<div id="rec" hidden><div class="pill">🔴 Идёт запись <span id="time">0:00</span></div><button id="stopRec">Стоп</button></div>
<div id="bar">
  <button class="btn" id="mic">🎙️</button>
  <input id="inp" placeholder="Сообщение...">
  <button class="btn" id="send">➤</button>
</div>

<div id="menu" class="panel" style="inset:auto;top:56px;right:8px;bottom:auto;background:#1d2740;border:1px solid #2a3550;border-radius:12px;min-width:220px">
  <div class="mitem" id="miGeneral">💬 Общий чат</div>
  <div class="mitem" id="miDM">📨 Переписка</div>
  <div class="mitem" id="miAcc">👤 Аккаунт</div>
  <div class="mitem" id="miName">✏️ Сменить имя</div>
</div>

<div id="dmPanel" class="panel">
  <div class="phead"><button class="ghost" id="dmBack">←</button>Переписка</div>
  <div class="pbody">
    <div class="hint">Личные чаты по тегу. Нужен аккаунт.</div>
    <div id="noAcc" class="hint" hidden>Сначала создай аккаунт в меню «Аккаунт».</div>
    <input id="peerTag" class="field" placeholder="@тег собеседника">
    <button class="primary" id="openDM">Открыть переписку</button>
    <div style="font-weight:700;margin-top:6px">Твои диалоги</div>
    <div id="dmList" style="display:flex;flex-direction:column;gap:8px"></div>
  </div>
</div>

<div id="accPanel" class="panel">
  <div class="phead"><button class="ghost" id="accBack">←</button>Аккаунт</div>
  <div class="pbody" id="accBody"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDNu4QlPuLrpNvC7pES3jgrOAkc2yT6M5M",
  authDomain: "myduschat.firebaseapp.com",
  databaseURL: "https://myduschat-default-rtdb.firebaseio.com",
  projectId: "myduschat",
  storageBucket: "myduschat.firebasestorage.app",
  messagingSenderId: "434801103362",
  appId: "1:434801103362:web:ff389930c964e57b514d1b",
  measurementId: "G-XP93MYXX2K"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

if(!localStorage.mydusUid) localStorage.mydusUid = Math.random().toString(36).slice(2);
const uid = localStorage.mydusUid;

function acc(){ try{ return JSON.parse(localStorage.mydusAcc||'null'); }catch(e){ return null; } }
function myName(){ const a = acc(); return a ? a.tag : (localStorage.mydusName || ''); }
if(!acc() && !localStorage.mydusName){
  let n = ''; while(!n){ n = (prompt('Как тебя зовут?')||'').trim().slice(0,30); } localStorage.mydusName = n;
}

async function sha(s){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}

const chat = document.getElementById('chat');
const inp  = document.getElementById('inp');
const ttl  = document.getElementById('ttl');

let cur = {type:'general'}, live = null;

function listen(r){
  if(live) live.off();
  live = r;
  chat.innerHTML = '';
  r.limitToLast(200).on('child_added', s=>{
    const v = s.val();
    if(!v || !v.n) return;
    add(v.n, v.t, v.t === 'voice' ? v.a : v.m, v.ts, v.u === uid);
  });
}

function openGeneral(){
  cur = {type:'general'};
  ttl.textContent = 'MydusChat — общий';
  listen(db.ref('messages'));
  hidePanels();
}

function dmKey(a, b){ return [a, b].sort().join('__'); }

function openDM(key, peer){
  if(!acc()){ alert('Нужен аккаунт: меню ☰ → Аккаунт'); showPanel('menu'); return; }
  cur = {type:'dm', key, peer};
  ttl.textContent = '@' + peer;
  listen(db.ref('dm/' + key + '/msgs'));
  hidePanels();
}

function add(n, type, payload, ts, mine){
  const row = document.createElement('div');
  row.className = 'row' + (mine ? ' me' : '');
  const box = document.createElement('div'); box.className = 'msg';
  const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = n;
  const tm = document.createElement('div'); tm.className = 'tm';
  tm.textContent = new Date(ts).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
  box.append(nm);
  if(type === 'voice'){
    const a = document.createElement('audio'); a.controls = true; a.src = payload;
    box.append(a);
  } else {
    const p = document.createElement('div'); p.textContent = payload;
    box.append(p);
  }
  box.append(tm);
  row.append(box); chat.append(row);
  chat.scrollTop = chat.scrollHeight;
}

function send(){
  const t = inp.value.trim().slice(0, 2000);
  if(!t) return;
  inp.value = '';
  const base = cur.type === 'general'
    ? db.ref('messages')
    : db.ref('dm/' + cur.key + '/msgs');
  base.push({n:myName(), u:uid, t:'text', m:t, ts:Date.now()});
}
document.getElementById('send').onclick = send;
inp.addEventListener('keydown', e=>{ if(e.key === 'Enter') send(); });

/* --- панели --- */
function hidePanels(){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('open'));
}
function togglePanel(id){
  const el = document.getElementById(id);
  const was = el.classList.contains('open');
  hidePanels();
  if(!was) el.classList.add('open');
}

document.getElementById('burger').onclick = ()=>{
  const acc0 = acc();
  document.getElementById('miName').hidden = !!acc0;
  document.getElementById('miAcc').textContent = acc0 ? ('👤 @' + acc0.tag) : '👤 Аккаунт';
  togglePanel('menu');
};

document.getElementById('miGeneral').onclick = openGeneral;
document.getElementById('miName').onclick = ()=>{
  hidePanels();
  const n = (prompt('Новое имя:', myName())||'').trim().slice(0,30);
  if(n) localStorage.mydusName = n;
};

document.getElementById('miDM').onclick = ()=>{
  hidePanels();
  if(!acc()) document.getElementById('noAcc').hidden = false;
  else document.getElementById('noAcc').hidden = true;
  togglePanel('dmPanel');
};
document.getElementById('dmBack').onclick = hidePanels;

document.getElementById('openDM').onclick = async ()=>{
  const tag = (document.getElementById('peerTag').value||'').trim().replace(/^@/,'');
  if(!tag) return;
  if(!acc()) return;
  const snap = await db.ref('users/' + tag).once('value');
  if(!snap.exists()){ alert('Аккаунт @' + tag + ' не найден'); return; }
  openDM(dmKey(acc().tag, tag), tag);
};

db.ref('dm').on('child_added', s=>{
  const a = acc(); if(!a) return;
  const k = s.key || '';
  if(!k.includes('__')) return;
  const parts = k.split('__');
  if(!parts.includes(a.tag)) return;
  const peer = parts.find(x=>x !== a.tag);
  if(document.getElementById('dmrow_' + k)) return;
  const d = document.createElement('div');
  d.className = 'dmi'; d.id = 'dmrow_' + k;
  d.textContent = '@' + peer;
  d.onclick = ()=> openDM(k, peer);
  document.getElementById('dmList').prepend(d);
});

/* --- аккаунт --- */
document.getElementById('miAcc').onclick = ()=>{ hidePanels(); renderAcc(); };
document.getElementById('accBack').onclick = hidePanels;

function renderAcc(){
  const b = document.getElementById('accBody');
  const a = acc();
  b.innerHTML = '';
  if(a){
    b.innerHTML =
      '<div style="font-weight:700;font-size:18px">@' + a.tag + '</div>' +
      '<div class="hint">Твой тег. По нему тебя найдут в переписке.</div>' +
      '<button class="primary" id="showPass">Показать пароль</button>' +
      '<div class="hint" id="passOut" hidden></div>' +
      '<button class="primary" id="logout" style="background:#5a2733">Выйти</button>';
    b.querySelector('#showPass').onclick = ()=>{
      const out = b.querySelector('#passOut');
      out.hidden = false; out.textContent = 'Пароль: ' + a.pass;
    };
    b.querySelector('#logout').onclick = ()=>{
      localStorage.removeItem('mydusAcc');
      renderAcc(); openGeneral();
    };
  } else {
    b.innerHTML =
      '<div class="hint">Аккаунт = тег и пароль. По ним можно войти на любом телефоне.</div>' +
      '<input id="regTag" class="field" placeholder="Тег (латиница, цифры, _), 3–20">' +
      '<input id="regPass" class="field" type="password" placeholder="Пароль (минимум 4 символа)">' +
      '<button class="primary" id="regBtn">Создать аккаунт</button>' +
      '<div class="hint">Уже есть аккаунт?</div>' +
      '<input id="logTag" class="field" placeholder="Тег">' +
      '<input id="logPass" class="field" type="password" placeholder="Пароль">' +
      '<button class="primary" id="logBtn">Войти</button>';
    b.querySelector('#regBtn').onclick = async ()=>{
      const tag = (b.querySelector('#regTag').value||'').trim().replace(/^@/,'');
      const pass = b.querySelector('#regPass').value;
      if(!/^[A-Za-z0-9_]{3,20}$/.test(tag)){ alert('Тег: 3–20 символов, только латиница, цифры и _'); return; }
      if(pass.length < 4){ alert('Пароль минимум 4 символа'); return; }
      const snap = await db.ref('users/' + tag).once('value');
      if(snap.exists()){ alert('Тег @' + tag + ' уже занят'); return; }
      const h = await sha(tag + ':' + pass);
      await db.ref('users/' + tag).set({p:h});
      localStorage.mydusAcc = JSON.stringify({tag, pass});
      renderAcc(); openGeneral();
    };
    b.querySelector('#logBtn').onclick = async ()=>{
      const tag = (b.querySelector('#logTag').value||'').trim().replace(/^@/,'');
      const pass = b.querySelector('#logPass').value;
      const snap = await db.ref('users/' + tag).once('value');
      if(!snap.exists()){ alert('Аккаунт @' + tag + ' не найден'); return; }
      const h = await sha(tag + ':' + pass);
      if(snap.val().p !== h){ alert('Неверный пароль'); return; }
      localStorage.mydusAcc = JSON.stringify({tag, pass});
      renderAcc(); openGeneral();
    };
  }
}

/* --- запись --- */
let rec = null, chunks = [], timer = null, sec = 0;
async function toggleRec(){
  if(rec){ rec.stop(); return; }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : '';
    rec = new MediaRecorder(stream, mime ? {mimeType:mime, audioBitsPerSecond:16000} : {audioBitsPerSecond:16000});
    chunks = []; sec = 0;
    document.getElementById('rec').hidden = false;
    timer = setInterval(()=>{
      sec++;
      document.getElementById('time').textContent = Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');
      if(sec >= 60) rec.stop();
    }, 1000);
    rec.ondataavailable = e => chunks.push(e.data);
    rec.onstop = () => {
      clearInterval(timer);
      document.getElementById('rec').hidden = true;
      rec.stream.getTracks().forEach(t=>t.stop());
      const blob = new Blob(chunks, {type: rec.mimeType || 'audio/webm'});
      const r = new FileReader();
      r.onload = () => {
        const base = cur.type === 'general'
          ? db.ref('messages')
          : db.ref('dm/' + cur.key + '/msgs');
        base.push({n:myName(), u:uid, t:'voice', a:r.result, ts:Date.now()});
      };
      r.readAsDataURL(blob);
      rec = null;
    };
    rec.start();
  }catch(e){
    alert('Нужно разрешить доступ к микрофону');
    rec = null;
  }
}
document.getElementById('mic').onclick = toggleRec;
document.getElementById('stopRec').onclick = () => rec && rec.stop();

openGeneral();
</script>
</body>
</html>
